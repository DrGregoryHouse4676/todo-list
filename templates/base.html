<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo List{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>📝 Todo</h1>
      <nav class="nav">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">🏠 Home</a>
        <a href="/tags/" class="{% if request.path.startswith:'/tags' %}active{% endif %}">🏷️ Tags</a>
      </nav>
      <p class="muted pill">Sidebar is visible on all pages.</p>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
