<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo List{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>📝 Todo</h1>
      <nav class="nav">
        {% url 'todo:task-list' as home_url %}
        {% url 'todo:tag-list' as tags_url %}
        {% with cur=request.resolver_match.url_name %}
          <a href="{{ home_url }}" class="{% if cur == 'task-list' %}active{% endif %}">🏠 Home</a>
          <a href="{{ tags_url }}" class="{% if cur in 'tag-list,tag-add,tag-update,tag-delete' %}active{% endif %}">🏷️ Tags</a>
        {% endwith %}
      </nav>
      <p class="muted pill">Sidebar is visible on all pages.</p>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
