{% extends 'todo/base.html' %}
{% block title %}Tag — form{% endblock %}
{% block content %}
  <div class="header">
    <h2>{% if object %}✏️ Edit tag{% else %}➕ Create tag{% endif %}</h2>
  </div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="row">
      <button class="btn btn-accent" type="submit">💾 Save</button>
      <a class="btn" href="{% url 'todo:tag-list' %}">✖️ Cancel</a>
    </div>
  </form>
{% endblock %}
